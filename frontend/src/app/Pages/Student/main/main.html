<app-navbar></app-navbar>

<div class="min-w-full min-h-screen flex flex-col gap-5 px-4 py-5 sm:px-6 sm:py-6 lg:px-8 lg:py-7 bg-gray-950 font-bold">

  <div class="flex flex-col gap-0.5 ml-1">
    <p class="text-white text-2xl sm:text-3xl font-semibold tracking-tight">Olá, {{ User().name }}!</p>
    <ng-container *ngIf="User().role == 'Student'">
      <p class="text-white/25 text-[11px] font-mono uppercase tracking-wider">Turma: {{ User().class.grade }}</p>
    </ng-container>
  </div>

  <app-student-status-card [student]="User()"></app-student-status-card>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

    <app-general-status-card
      [tasks]="User().class.myTasks"
      [submittedtasks]="User().submittedTasks"
      [subjects]="User().class.subjects"
      class="lg:col-start-1 lg:col-end-3">
    </app-general-status-card>

    <div class="flex flex-col gap-4">
      <app-pending-tests-card
        [submittedtests]="User().submittedTasks"
        [pendingtests]="User().class.myTasks">
      </app-pending-tests-card>
      <app-pending-tasks-card
        [submittedtasks]="User().submittedTasks"
        [pendingtasks]="User().class.myTasks">
      </app-pending-tasks-card>
    </div>

  </div>

</div>
