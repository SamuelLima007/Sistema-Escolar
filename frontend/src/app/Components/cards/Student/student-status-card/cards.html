<div class="flex flex-row justify-between gap-3 font-bold">

  <div class="relative flex flex-col justify-between gap-3 p-4 rounded-2xl border border-white/[0.07] bg-gradient-to-b from-gray-900/80 to-gray-950/80 w-full overflow-hidden shadow-2xl">
    <div class="absolute -top-8 -left-6 w-32 h-32 bg-green-400/5 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute left-0 top-0 w-[3px] h-full rounded-r-full bg-gradient-to-b from-green-400/60 to-transparent"></div>

    <div class="flex items-center justify-between gap-2">
      <p class="text-white/30 text-[11px] font-mono uppercase tracking-wider">Média Geral</p>
      <select name="Unit" id="Unit"
        class="text-white/70 text-[10px] font-mono focus:outline-none border border-white/[0.08] bg-white/[0.04] hover:bg-white/[0.07] rounded-lg text-center px-2 py-1 cursor-pointer transition-all appearance-none"
        [(ngModel)]="Unit">
        <option [value]="1" class="bg-gray-900">1ª</option>
        <option [value]="2" class="bg-gray-900">2ª</option>
        <option [value]="3" class="bg-gray-900">3ª</option>
        <option [value]="4" class="bg-gray-900">4ª</option>
      </select>
    </div>

    <p class="text-green-400 text-3xl font-bold font-mono tracking-tight">{{ GeneralAverage }}</p>
  </div>

  <div class="relative flex flex-col justify-between gap-3 p-4 rounded-2xl border border-white/[0.07] bg-gradient-to-b from-gray-900/80 to-gray-950/80 w-full overflow-hidden shadow-2xl">
    <div class="absolute -top-8 -left-6 w-32 h-32 bg-blue-400/5 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute left-0 top-0 w-[3px] h-full rounded-r-full bg-gradient-to-b from-blue-400/60 to-transparent"></div>

    <p class="text-white/30 text-[11px] font-mono uppercase tracking-wider">Disciplinas</p>
    <p class="text-blue-400 text-3xl font-bold font-mono tracking-tight">{{ SubjectCount }}</p>
  </div>

  <div class="relative flex flex-col justify-between gap-3 p-4 rounded-2xl border border-white/[0.07] bg-gradient-to-b from-gray-900/80 to-gray-950/80 w-full overflow-hidden shadow-2xl">
    <div class="absolute -top-8 -left-6 w-32 h-32 bg-yellow-400/5 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute left-0 top-0 w-[3px] h-full rounded-r-full bg-gradient-to-b from-yellow-400/60 to-transparent"></div>

    <p class="text-white/30 text-[11px] font-mono uppercase tracking-wider">Trabalhos Pendentes</p>
    <p class="text-yellow-400 text-3xl font-bold font-mono tracking-tight">{{ TasksCount }}</p>
  </div>


  <div class="relative flex flex-col justify-between gap-3 p-4 rounded-2xl border border-white/[0.07] bg-gradient-to-b from-gray-900/80 to-gray-950/80 w-full overflow-hidden shadow-2xl">
    <div class="absolute -top-8 -left-6 w-32 h-32 bg-purple-400/5 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute left-0 top-0 w-[3px] h-full rounded-r-full bg-gradient-to-b from-purple-400/60 to-transparent"></div>

    <p class="text-white/30 text-[11px] font-mono uppercase tracking-wider">Próximas Provas</p>
    <p class="text-purple-400 text-3xl font-bold font-mono tracking-tight">{{ TestsCount }}</p>
  </div>

</div>
